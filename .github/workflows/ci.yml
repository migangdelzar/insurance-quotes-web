---
name: Frontend CI

on: # yamllint disable-line rule:truthy
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: >-
    frontend-ci-${{ github.event.pull_request.head.repo.full_name ||
    github.repository }}-${{ github.event.pull_request.head.ref ||
    github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  quality:
    name: Web quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web tests
        run: bun run --filter web test

      - name: Run lint
        run: |
          bun run --filter web lint
          bun run --filter e2e lint

      - name: Validate locale catalog
        working-directory: packages/app-i18n
        run: bun run validate

      - name: Check changed-source formatting
        run: >-
          bunx prettier --check
          apps/web/src
          apps/web/index.html
          apps/web/vite.config.ts
          e2e/tests
          e2e/playwright.config.ts
          .github/workflows/ci.yml
          README.md

      - name: Build workspace
        env:
          VITE_API_BASE_URL: /api
        run: bun run build

      - name: Check production PWA artifacts
        working-directory: apps/web
        run: node src/pwa/check-build.mjs

  docker:
    name: Build production web image
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: insurance-quotes-web:ci
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  responsive:
    name: Responsive browser audit
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install workspace-pinned Chromium
        working-directory: e2e
        run: |
          declared_version="$(bun -p 'require("./package.json").devDependencies["@playwright/test"]')"
          installed_version="$(bun run --silent playwright --version)"
          test "$installed_version" = "Version $declared_version"
          bun run playwright install --with-deps chromium

      - name: Start Vite server
        env:
          VITE_API_BASE_URL: /api
        run: |
          bun run --filter web dev -- \
            --host 127.0.0.1 --port 3100 \
            > /tmp/insurance-quotes-web.log 2>&1 &
          echo $! > /tmp/insurance-quotes-web.pid

      - name: Wait for Vite server
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/insurance-quotes-web.log
          exit 1

      - name: Run responsive browser audit
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
        run: >-
          bun run test
          tests/responsive-layout.spec.ts
          --project=desktop-chromium

      - name: Run mocked quote journey
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
        run: >-
          bun run test
          tests/premium-shell.spec.ts
          --project=mobile-chromium
          --project=desktop-chromium
          --retries=0

      - name: Run app-first browser audits
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
        run: >-
          bun run test
          tests/app-navigation.spec.ts
          tests/app-accessibility.spec.ts
          tests/dashboard-responsive.spec.ts
          --project=mobile-chromium
          --project=desktop-chromium
          --retries=0

      - name: Stop Vite server
        if: ${{ always() }}
        run: kill "$(cat /tmp/insurance-quotes-web.pid)" 2>/dev/null || true

  pwa:
    name: Production PWA preview
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install workspace-pinned Chromium
        working-directory: e2e
        run: |
          declared_version="$(bun -p 'require("./package.json").devDependencies["@playwright/test"]')"
          installed_version="$(bun run --silent playwright --version)"
          test "$installed_version" = "Version $declared_version"
          bun run playwright install --with-deps chromium

      - name: Run production PWA preview
        env:
          E2E_PWA_PREVIEW_PORT: 43102
          VITE_API_BASE_URL: /api
        run: bun run --filter e2e test:pwa-preview
