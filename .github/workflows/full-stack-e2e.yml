name: Full-stack real E2E

on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag, or SHA to verify
        required: false
        default: feat-backend-core

concurrency:
  group: >-
    full-stack-e2e-${{ github.event.pull_request.head.repo.full_name ||
    github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-e2e:
    name: Build and exercise the real JVM stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          path: insurance-quotes-web

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: migangdelzar/insurance-quotes-service
          ref: ${{ inputs.backend_ref || 'feat-backend-core' }}
          path: insurance-quotes-service

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install frontend dependencies
        working-directory: insurance-quotes-web
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: insurance-quotes-web
        run: bun run --filter e2e playwright install --with-deps chromium

      - name: Validate Compose configuration
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/compose.fullstack.yml
          -f deployment/compose/compose.e2e.yml
          config

      - name: Start ephemeral JVM stack
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/compose.fullstack.yml
          -f deployment/compose/compose.e2e.yml
          up -d --build

      - name: Verify API, frontend, seeded login, and analytics summary
        working-directory: insurance-quotes-service
        run: |
          set -euo pipefail
          compose=(
            docker compose
            -f deployment/compose/docker-compose.yml
            -f deployment/compose/docker-compose.jvm.yml
            -f deployment/compose/compose.fullstack.yml
            -f deployment/compose/compose.e2e.yml
          )
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3100/api/actuator/health |
              grep -q '"status":"UP"'; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              "${compose[@]}" logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:3100/ > /dev/null
          token=$(curl --fail --silent --show-error http://localhost:3100/api/auth/login \
            -H 'Content-Type: application/json' \
            -H 'API-Version: 1.0' \
            --data '{"username":"demo","password":"demo-password"}' |
            jq -r '.tokens.accessToken')
          test -n "$token" && test "$token" != "null"
          curl --fail --silent http://localhost:3100/api/quotes/summary \
            -H "Authorization: Bearer $token" \
            -H 'API-Version: 1.0' | jq -e '(.totalQuotes != null) and ((.trend | length) == 7)'

      - name: Run real Playwright flows
        env:
          E2E_BASE_URL: http://localhost:3100
        working-directory: insurance-quotes-web
        run: bun run e2e -- --retries=0

      - name: Upload stack and Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-diagnostics
          if-no-files-found: warn
          path: |
            insurance-quotes-web/e2e/test-results
            insurance-quotes-web/e2e/playwright-report

      - name: Dump Compose logs on failure
        if: ${{ failure() }}
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/compose.fullstack.yml
          -f deployment/compose/compose.e2e.yml
          logs --no-color

      - name: Tear down ephemeral stack
        if: ${{ always() }}
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/compose.fullstack.yml
          -f deployment/compose/compose.e2e.yml
          down --volumes --remove-orphans
